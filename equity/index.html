<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エクイティ即答トレーナー</title>
<meta name="theme-color" content="#DCE0DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equity">
<meta name="description" content="フロップのエクイティを即答するトレーニング。990通り全列挙で正確に計算。">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23131A18'/%3E%3Crect x='8' y='26' width='24' height='12' fill='%231E45C9'/%3E%3Crect x='32' y='26' width='24' height='12' fill='%23C0102A'/%3E%3Crect x='30' y='18' width='3' height='28' fill='%23DCE0DC'/%3E%3C/svg%3E">
<style>
  :root{
    --steel:#DCE0DC; --panel:#F4F6F3; --ink:#131A18; --dim:#5C6763;
    --rule:#9AA39D; --blue:#1E45C9; --red:#C0102A; --felt:#0B6E4F;
    --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--steel);}
  body{
    font-family:var(--jp); color:var(--ink);
    padding:12px 12px calc(20px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    padding-right:calc(12px + env(safe-area-inset-right));
    padding-top:calc(12px + env(safe-area-inset-top));
    max-width:560px; margin:0 auto; -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; overscroll-behavior-y:contain;
  }
  button{font-family:inherit;}
  button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;}
  .title{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.02em;}
  .clock{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;}
  /* 3秒ルールのゲージ */
  .pace{height:2px;background:var(--rule);position:relative;margin-top:0;}
  .pace i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);display:block;}
  .pace.over i{background:var(--red);}

  .toggles{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap;}
  .tog{font-size:12px;font-family:var(--mono);padding:9px 11px;border:1.5px solid var(--ink);
       background:transparent;color:var(--ink);cursor:pointer;letter-spacing:.04em;-webkit-tap-highlight-color:transparent;}
  .tog[aria-pressed="true"]{background:var(--ink);color:var(--steel);}

  .panel{background:var(--panel);border:1.5px solid var(--ink);padding:14px;}
  .flop{display:flex;align-items:center;gap:9px;justify-content:center;padding:12px 0 16px;}

  .pcard{background:#fff;border:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;
         justify-content:center;font-family:var(--mono);line-height:1;color:var(--ink);}
  .pcard.red{color:var(--red);}
  .lg{width:54px;height:74px;gap:3px;} .lg .r{font-size:27px;font-weight:700;letter-spacing:-.04em;} .lg .s{font-size:16px;}
  .md{width:44px;height:60px;gap:2px;} .md .r{font-size:21px;font-weight:700;letter-spacing:-.04em;} .md .s{font-size:13px;}

  .duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;}
  .side{border:1.5px solid var(--ink);padding:10px 8px;background:#fff;}
  .side.a{border-left:5px solid var(--blue);} .side.b{border-left:5px solid var(--red);}
  .side-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);}
  .side-cards{display:flex;gap:5px;justify-content:center;margin:8px 0 6px;}
  .side-made{font-size:12.5px;font-weight:600;text-align:center;}
  .side-draw{font-size:10.5px;color:var(--dim);text-align:center;margin-top:3px;line-height:1.45;}
  .vs{font-family:var(--mono);font-size:11px;color:var(--dim);align-self:center;letter-spacing:.1em;}

  .ask{margin-top:14px;}
  .ask-q{font-size:13.5px;font-weight:600;margin-bottom:9px;}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .pick{font-family:var(--mono);font-size:15px;font-weight:700;padding:18px 8px;border:1.5px solid var(--ink);
        background:#fff;cursor:pointer;letter-spacing:.06em;-webkit-tap-highlight-color:transparent;}
  .pick.a{border-left:5px solid var(--blue);} .pick.b{border-left:5px solid var(--red);}
  .pick:active{background:var(--ink);color:var(--steel);}
  .slider-row{display:flex;align-items:center;gap:12px;}
  .slider-val{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.04em;
              font-variant-numeric:tabular-nums;min-width:92px;}
  input[type=range]{width:100%;accent-color:var(--ink);height:34px;}

  .cal{margin-top:16px;}
  .cal-track{position:relative;height:36px;border:1.5px solid var(--ink);background:#fff;overflow:hidden;}
  .fa{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .fb{position:absolute;right:0;top:0;bottom:0;background:var(--red);transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .gap{position:absolute;top:0;bottom:0;transition:all .5s cubic-bezier(.2,.8,.2,1);
       background:repeating-linear-gradient(45deg,rgba(19,26,24,.85) 0 3px,rgba(255,255,255,.9) 3px 6px);}
  .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule);}
  .needle{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);transition:left .5s cubic-bezier(.2,.8,.2,1);}
  .cal-labels{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:12px;font-weight:700;}
  .cal-legend{display:flex;gap:14px;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--dim);flex-wrap:wrap;}

  .verdict{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--ink);}
  .badge{font-family:var(--mono);font-size:13px;font-weight:700;padding:5px 10px;letter-spacing:.06em;}
  .ok{background:var(--felt);color:#fff;} .ng{background:var(--red);color:#fff;}
  .verdict-sub{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;}

  .sec{margin-top:16px;}
  .sec-h{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
         border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:9px;}
  .note{font-size:12.5px;line-height:1.65;}

  .ranks{display:flex;flex-wrap:wrap;gap:5px;}
  .rchip{font-family:var(--mono);font-size:12px;font-weight:700;min-width:36px;text-align:center;
         padding:7px 4px;border:1.5px solid var(--ink);background:#fff;}
  .rchip .d{display:block;font-size:9px;font-weight:400;margin-top:2px;font-variant-numeric:tabular-nums;}
  .up{background:var(--felt);color:#fff;border-color:var(--felt);}
  .down{background:var(--red);color:#fff;border-color:var(--red);}
  .flat{color:var(--dim);}
  .poison{background:#fff;color:var(--red);border-color:var(--red);border-style:dashed;}

  .next{width:100%;margin-top:16px;font-family:var(--mono);font-size:15px;font-weight:700;padding:18px;
        border:1.5px solid var(--ink);background:var(--ink);color:var(--steel);cursor:pointer;letter-spacing:.1em;
        -webkit-tap-highlight-color:transparent;}
  .stats{display:flex;gap:16px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--dim);
         border-top:1px solid var(--rule);padding-top:9px;font-variant-numeric:tabular-nums;flex-wrap:wrap;
         align-items:baseline;}
  .stats b{color:var(--ink);font-size:14px;}
  .reset{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);background:none;
         border:none;text-decoration:underline;cursor:pointer;padding:4px;}
  .loading{text-align:center;padding:40px 0;font-family:var(--mono);font-size:12px;color:var(--dim);}
  .anc-lead{font-size:12.5px;line-height:1.7;margin:10px 0 14px;}
  .stair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
  .stair-i{display:flex;align-items:baseline;gap:7px;border:1.5px solid var(--ink);background:#fff;padding:8px 9px;}
  .stair-n{font-family:var(--mono);font-size:10px;color:var(--steel);background:var(--ink);padding:1px 5px;}
  .stair-a{font-size:11.5px;font-weight:600;}
  .stair-b{font-family:var(--mono);font-size:12px;font-weight:700;margin-left:auto;}
  .anc-list{border-top:1px solid var(--rule);}
  .anc-row{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rule);}
  .anc-l{font-size:12px;line-height:1.4;}
  .anc-v{font-family:var(--mono);font-size:14px;font-weight:700;margin-left:auto;white-space:nowrap;
         font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion:reduce){ .fa,.fb,.gap,.needle,.pace i{transition:none;} }
  @media (max-width:360px){
    .lg{width:46px;height:64px;} .lg .r{font-size:23px;}
    .md{width:38px;height:52px;} .md .r{font-size:18px;}
  }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="eyebrow">Flop Equity</div>
    <div class="title">エクイティ即答トレーナー</div>
  </div>
  <div class="clock" id="clock">0.0s</div>
</div>
<div class="pace" id="pace"><i></i></div>

<div class="toggles">
  <button class="tog" id="m-binary" aria-pressed="true">どっちが有利?</button>
  <button class="tog" id="m-estimate" aria-pressed="false">勝率を当てる</button>
  <button class="tog" id="m-close" aria-pressed="false">僅差だけ出す</button>
  <button class="tog" id="m-anchors" aria-pressed="false">アンカー表</button>
</div>

<div class="panel" id="panel"><div class="loading">配牌中…</div></div>

<div class="stats" id="stats"></div>

<script>
/* ============================================================
   エンジン: 7枚評価 + フロップ完全列挙（990通り）
   ============================================================ */
const RANKS="23456789TJQKA", SUITS="shdc";
const GLYPH={s:"\u2660",h:"\u2665",d:"\u2666",c:"\u2663"};
const rv=c=>RANKS.indexOf(c[0])+2, su=c=>c[1];
const rankName=n=>n<=9?String(n):{10:"10",11:"J",12:"Q",13:"K",14:"A"}[n];
const FULL=[]; for(const r of RANKS) for(const s of SUITS) FULL.push(r+s);

function straightHigh(rs){
  const u=[...new Set(rs)].sort((a,b)=>b-a);
  if(u.includes(14)) u.push(1);
  let run=1;
  for(let i=1;i<u.length;i++){
    if(u[i]===u[i-1]-1){ run++; if(run>=5) return u[i]+4; } else run=1;
  }
  return null;
}
function evalHand(cards){
  const ranks=cards.map(rv).sort((a,b)=>b-a), suits=cards.map(su);
  let fs=null;
  for(const s of SUITS) if(suits.filter(x=>x===s).length>=5) fs=s;
  if(fs){
    const fr=cards.filter(c=>su(c)===fs).map(rv), sh=straightHigh(fr);
    if(sh) return [sh===14?9:8,sh];
  }
  const counts=new Map();
  for(const r of ranks) counts.set(r,(counts.get(r)||0)+1);
  const by=[...counts.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  if(by[0][1]===4){ const k=Math.max(...[...counts.keys()].filter(r=>r!==by[0][0])); return [7,by[0][0],k]; }
  if(by[0][1]===3&&by[1]&&by[1][1]>=2) return [6,by[0][0],by[1][0]];
  if(fs){ const fr=cards.filter(c=>su(c)===fs).map(rv).sort((a,b)=>b-a).slice(0,5); return [5,...fr]; }
  const sh=straightHigh(ranks); if(sh) return [4,sh];
  if(by[0][1]===3){ const ks=[...counts.keys()].filter(r=>r!==by[0][0]).sort((a,b)=>b-a).slice(0,2); return [3,by[0][0],...ks]; }
  if(by[0][1]===2&&by[1]&&by[1][1]===2){
    const p=[by[0][0],by[1][0]].sort((a,b)=>b-a);
    const k=Math.max(...[...counts.keys()].filter(r=>!p.includes(r)));
    return [2,...p,k];
  }
  if(by[0][1]===2){ const ks=[...counts.keys()].filter(r=>r!==by[0][0]).sort((a,b)=>b-a).slice(0,3); return [1,by[0][0],...ks]; }
  return [0,...ranks.slice(0,5)];
}
function cmp(a,b){
  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){ const x=a[i]??-1, y=b[i]??-1; if(x!==y) return x-y; }
  return 0;
}
function flopEquity(h1,h2,board){
  const used=new Set([...h1,...h2,...board]);
  const rem=FULL.filter(c=>!used.has(c));
  let w=0,l=0,t=0;
  for(let i=0;i<rem.length;i++){
    const b4=[...board,rem[i]];
    for(let j=i+1;j<rem.length;j++){
      const b=[...b4,rem[j]];
      const d=cmp(evalHand([...h1,...b]),evalHand([...h2,...b]));
      if(d>0)w++; else if(d<0)l++; else t++;
    }
  }
  return (w+t/2)/(w+l+t);
}
/* 出題フィルタ用の粗い見積もり（重い全列挙の前に足切りする） */
function quickEquity(h1,h2,board,n){
  const used=new Set([...h1,...h2,...board]);
  const rem=FULL.filter(c=>!used.has(c));
  let s=0;
  for(let k=0;k<n;k++){
    let i=Math.floor(Math.random()*rem.length), j=Math.floor(Math.random()*rem.length);
    while(j===i) j=Math.floor(Math.random()*rem.length);
    const b=[...board,rem[i],rem[j]];
    const d=cmp(evalHand([...h1,...b]),evalHand([...h2,...b]));
    s += d>0?1:d<0?0:0.5;
  }
  return s/n;
}
function turnMap(h1,h2,board){
  const used=new Set([...h1,...h2,...board]);
  const rem=FULL.filter(c=>!used.has(c));
  const byRank=new Map();
  for(const tc of rem){
    const b4=[...board,tc];
    let w=0,l=0,t=0;
    for(const rc of rem){
      if(rc===tc) continue;
      const b=[...b4,rc];
      const d=cmp(evalHand([...h1,...b]),evalHand([...h2,...b]));
      if(d>0)w++; else if(d<0)l++; else t++;
    }
    const r=rv(tc);
    if(!byRank.has(r)) byRank.set(r,[]);
    byRank.get(r).push((w+t/2)/(w+l+t));
  }
  return [...byRank.entries()]
    .map(([rank,list])=>({rank,label:rankName(rank),eq:list.reduce((a,b)=>a+b,0)/list.length}))
    .sort((a,b)=>b.rank-a.rank);
}

/* ============================================================
   ハンド解説
   ============================================================ */
const CAT_JP=["ハイカード","ワンペア","ツーペア","スリーカード","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ","ロイヤルフラッシュ"];
function describe(hand,board){
  const all=[...hand,...board], ev=evalHand(all), cat=ev[0];
  const br=board.map(rv).sort((a,b)=>b-a), hr=hand.map(rv).sort((a,b)=>b-a);
  const pocket=hr[0]===hr[1];
  let made=CAT_JP[cat];
  if(cat===1){
    const pr=ev[1];
    if(pocket&&hr[0]===pr){
      made = pr>br[0] ? "オーバーペア" : pr<br[br.length-1] ? "アンダーペア" : "ミドルポケットペア";
    } else {
      const i=br.indexOf(pr);
      made = i===0?"トップペア":i===1?"セカンドペア":i===2?"ボトムペア":"ワンペア";
    }
  } else if(cat===3){ made = pocket?"セット":"トリップス"; }

  const draws=[]; let outs=0;
  const sc={}; for(const c of all) sc[su(c)]=(sc[su(c)]||0)+1;
  for(const s of SUITS){
    const total=sc[s]||0, inHand=hand.filter(c=>su(c)===s).length;
    if(cat<5&&total===4&&inHand>=1){ draws.push("フラッシュドロー"); outs+=9; }
    else if(cat<5&&total===3&&inHand>=1){ draws.push("バックドアFD"); }
  }
  if(cat<4){
    const comp=[];
    for(let r=2;r<=14;r++){
      const avail=FULL.filter(c=>rv(c)===r&&!all.includes(c));
      if(!avail.length) continue;
      if(avail.some(c=>straightHigh([...all,c].map(rv))!==null)) comp.push({rank:r,n:avail.length});
    }
    const so=comp.reduce((s,x)=>s+x.n,0);
    if(comp.length>=2){ draws.push("ストレートドロー（"+comp.map(c=>rankName(c.rank)).join("・")+"）"); outs+=so; }
    else if(comp.length===1){ draws.push("ガットショット（"+rankName(comp[0].rank)+"のみ）"); outs+=so; }
  }
  if(cat===0){
    const over=hr.filter(r=>r>br[0]).length;
    if(over>0) draws.push("オーバーカード"+over+"枚");
  }
  return {made,draws,outs,cat};
}

/* ============================================================
   出題生成
   ============================================================ */
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function drawHand(dead){
  const pool=FULL.filter(c=>!dead.has(c)), kind=Math.random();
  for(let a=0;a<120;a++){
    const p=shuffle(pool);
    if(kind<0.22){ for(const x of p) for(const y of p) if(x!==y&&rv(x)===rv(y)) return [x,y]; }
    else if(kind<0.55){
      for(const x of p) for(const y of p){
        if(x===y||su(x)!==su(y)) continue;
        const gap=Math.abs(rv(x)-rv(y)), hi=Math.max(rv(x),rv(y));
        if(gap<=4||hi===14||(hi>=11&&gap<=5)) return [x,y];
      }
    } else if(kind<0.85){
      for(const x of p) for(const y of p){
        if(x===y||su(x)===su(y)) continue;
        const lo=Math.min(rv(x),rv(y)), hi=Math.max(rv(x),rv(y));
        if(hi>=12&&lo>=9) return [x,y];
        if(hi===14&&lo>=8) return [x,y];
      }
    } else { const q=shuffle(pool); return [q[0],q[1]]; }
  }
  const q=shuffle(pool); return [q[0],q[1]];
}
function makeSpot(closeOnly){
  for(let attempt=0;attempt<500;attempt++){
    const dead=new Set();
    const h1=drawHand(dead); h1.forEach(c=>dead.add(c));
    const h2=drawHand(dead); h2.forEach(c=>dead.add(c));
    const key=h=>h.map(rv).sort((a,b)=>a-b).join("-");
    if(key(h1)===key(h2)) continue;
    const board=shuffle(FULL.filter(c=>!dead.has(c))).slice(0,3);
    const d1=describe(h1,board), d2=describe(h2,board);
    if(d1.cat===0&&d2.cat===0&&d1.outs<4&&d2.outs<4) continue;
    // 粗い見積もりで足切りしてから全列挙
    const q=quickEquity(h1,h2,board,120);
    if(q<0.06||q>0.94) continue;
    if(closeOnly&&Math.abs(q-0.5)>0.20) continue;
    const eq=flopEquity(h1,h2,board);
    if(eq<0.10||eq>0.90) continue;
    if(closeOnly&&Math.abs(eq-0.5)>0.12) continue;
    const sortH=h=>[...h].sort((a,b)=>rv(b)-rv(a));
    return {h1:sortH(h1),h2:sortH(h2),board,eq,d1,d2};
  }
  const h1=["As","Ks"],h2=["Qh","Qd"],board=["Jc","Td","9h"];
  return {h1,h2,board,eq:flopEquity(h1,h2,board),d1:describe(h1,board),d2:describe(h2,board)};
}

/* 検算済みのアンカー値（各3例の実測にもとづく） */
const ANCHORS=[
  {eq:18,disp:"16〜20%",side:"draw",label:"ガットショットのみ vs オーバーペア"},
  {eq:25,disp:"25%",side:"draw",label:"オーバーカード2枚のみ vs アンダーペア"},
  {eq:33,disp:"33%",side:"draw",label:"オープンエンドのみ vs オーバーペア"},
  {eq:37,disp:"37%",side:"draw",label:"フラッシュドローのみ vs オーバーペア"},
  {eq:56,disp:"56%",side:"draw",label:"コンボドロー（FD+OESD） vs オーバーペア"},
  {eq:63,disp:"63%",side:"made",label:"トップペア vs フラッシュドロー"},
  {eq:66,disp:"66%",side:"made",label:"トップペア vs オープンエンド"},
  {eq:66,disp:"66%",side:"made",label:"オーバーペア vs オープンエンド"},
  {eq:74,disp:"74%",side:"made",label:"セット vs フラッシュドロー"},
  {eq:75,disp:"75%",side:"made",label:"ツーペア vs オーバーペア"},
  {eq:79,disp:"79%",side:"made",label:"トップペア vs セカンドペア"},
  {eq:87,disp:"87%",side:"made",label:"ドミネート（AK vs AQ） Aハイボード"},
  {eq:91,disp:"91%",side:"made",label:"オーバーペア vs アンダーペア"},
  {eq:96,disp:"96%",side:"made",label:"セット vs セット（上）"},
  {eq:98,disp:"98%",side:"made",label:"セット vs トップペア"},
];
/* A側・B側の両方から見て、近い基準値を探す */
function nearestAnchor(pctA){
  let best=null;
  for(const a of ANCHORS){
    for(const [p,who] of [[pctA,"A"],[100-pctA,"B"]]){
      const d=Math.abs(a.eq-p);
      if(d<=4 && (!best || d<best.d || (d===best.d && who==="A" && best.who!=="A"))) best={...a,d,who};
    }
  }
  return best;
}

/* ============================================================
   状態と描画
   ============================================================ */
const S={mode:"binary",closeOnly:false,spot:null,phase:"ask",guess:50,choice:null,tmap:null,elapsed:0,t0:0,view:"quiz"};
const DEFAULT_STATS={n:0,correct:0,errSum:0,errN:0,streak:0,best:0};
let stats={...DEFAULT_STATS};
try{ const raw=localStorage.getItem("equity-trainer-stats"); if(raw) stats={...DEFAULT_STATS,...JSON.parse(raw)}; }catch(e){}
function saveStats(){ try{ localStorage.setItem("equity-trainer-stats",JSON.stringify(stats)); }catch(e){} }

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function cardHTML(c,size){
  const r=c[0], s=su(c), red=(s==="h"||s==="d");
  return '<div class="pcard '+size+(red?" red":"")+'"><span class="r">'+(r==="T"?"10":r)+'</span><span class="s">'+GLYPH[s]+'</span></div>';
}

let paceTimer=null;
function startClock(){
  S.t0=Date.now(); S.elapsed=0;
  $("pace").classList.remove("over");
  clearInterval(paceTimer);
  paceTimer=setInterval(()=>{
    S.elapsed=(Date.now()-S.t0)/1000;
    $("clock").textContent=S.elapsed.toFixed(1)+"s";
    const pct=Math.min(100,(S.elapsed/3)*100);
    $("pace").firstElementChild.style.width=pct+"%";
    if(S.elapsed>3) $("pace").classList.add("over");
  },100);
}
function stopClock(){ clearInterval(paceTimer); }
function pauseClock(){ clearInterval(paceTimer); }
function resumeClock(){
  clearInterval(paceTimer);
  S.t0=Date.now()-S.elapsed*1000;
  paceTimer=setInterval(()=>{
    S.elapsed=(Date.now()-S.t0)/1000;
    $("clock").textContent=S.elapsed.toFixed(1)+"s";
    const pct=Math.min(100,(S.elapsed/3)*100);
    $("pace").firstElementChild.style.width=pct+"%";
    if(S.elapsed>3) $("pace").classList.add("over");
  },100);
}

function deal(){
  S.phase="ask"; S.guess=50; S.choice=null; S.tmap=null;
  $("panel").innerHTML='<div class="loading">配牌中…</div>';
  stopClock(); $("clock").textContent="0.0s";
  $("pace").firstElementChild.style.width="0%"; $("pace").classList.remove("over");
  // 生成は重いので描画を先に出してから回す
  setTimeout(()=>{ S.spot=makeSpot(S.closeOnly); render(); startClock(); },30);
}

function answer(side){
  if(S.phase==="revealed") return;
  stopClock();
  const truePct=S.spot.eq*100;
  let ok=false, err=null;
  if(S.mode==="binary"){
    S.choice=side;
    ok = side===(truePct>=50?"A":"B");
  } else {
    err=Math.abs(S.guess-truePct); ok=err<=7;
  }
  stats.n++; if(ok) stats.correct++;
  if(err!==null){ stats.errSum+=err; stats.errN++; }
  stats.streak = ok ? stats.streak+1 : 0;
  stats.best = Math.max(stats.best, stats.streak);
  saveStats();
  S.phase="revealed";
  render();
  setTimeout(()=>{ S.tmap=turnMap(S.spot.h1,S.spot.h2,S.spot.board); render(); },20);
}

/* アンカー表ビュー */
function renderAnchors(){
  let h='<div class="eyebrow" style="text-align:center">Anchors</div>';
  h+='<div class="anc-lead">実測にもとづく基準値。まず<b>4段の階段</b>を体に入れて、そこから微調整するのが速い。</div>';
  h+='<div class="stair">';
  [["ドロー側","〜37%"],["made hand","60%台"],["セット級","75%前後"],["圧倒","90%超"]].forEach(([a,b],i)=>{
    h+='<div class="stair-i"><span class="stair-n">'+(i+1)+'</span><span class="stair-a">'+a+'</span><span class="stair-b">'+b+'</span></div>';
  });
  h+='</div>';

  h+='<div class="sec"><div class="sec-h">ドロー側から見た勝率</div><div class="anc-list">';
  for(const a of ANCHORS.filter(x=>x.side==="draw")){
    h+='<div class="anc-row"><span class="anc-l">'+esc(a.label)+'</span><span class="anc-v">'+esc(a.disp)+'</span></div>';
  }
  h+='</div></div>';

  h+='<div class="sec"><div class="sec-h">made hand 側から見た勝率</div><div class="anc-list">';
  for(const a of ANCHORS.filter(x=>x.side==="made")){
    h+='<div class="anc-row"><span class="anc-l">'+esc(a.label)+'</span><span class="anc-v">'+esc(a.disp)+'</span></div>';
  }
  h+='</div></div>';

  h+='<div class="sec"><div class="sec-h">使う手順</div><div class="note">'
   + '<b>① 弱い側からアウツを数える</b>　フロップなら ×4。<br>'
   + '<b>② アウトの質で割り引く</b>　毒アウト（役は上がるのに相手がもっと伸びる）は数えない。再逆転されるアウトは0.7枚で見る。<br>'
   + '<b>③ 相手のドローを引く</b>　相手にもドローがあれば、さらに2〜3割減らす。'
   + '</div></div>';

  h+='<button class="next" id="anc-close">問題に戻る</button>';
  $("panel").innerHTML=h;
  $("anc-close").addEventListener("click",()=>setView("quiz"));
}

function setView(v){
  S.view=v;
  $("m-anchors").setAttribute("aria-pressed",String(v==="anchors"));
  if(v==="anchors"){ pauseClock(); renderAnchors(); }
  else { render(); if(S.phase==="ask") resumeClock(); }
}

function render(){
  if(S.view==="anchors"){ renderAnchors(); return; }
  const sp=S.spot; if(!sp) return;
  const truePct=sp.eq*100;
  const guessPct = S.mode==="estimate" ? S.guess : (S.choice==="A"?75:S.choice==="B"?25:50);
  const err=Math.abs(guessPct-truePct);

  let h='<div class="eyebrow" style="text-align:center">Flop</div>';
  h+='<div class="flop">'+sp.board.map(c=>cardHTML(c,"lg")).join("")+'</div>';
  h+='<div class="duel">';
  [["a","A",sp.h1,sp.d1],["b","B",sp.h2,sp.d2]].forEach(([cls,tag,hand,d],i)=>{
    if(i===1) h+='<div class="vs">VS</div>';
    h+='<div class="side '+cls+'"><div class="side-tag">'+tag+'</div>';
    h+='<div class="side-cards">'+hand.map(c=>cardHTML(c,"md")).join("")+'</div>';
    if(S.phase==="revealed"){
      h+='<div class="side-made">'+esc(d.made)+'</div>';
      h+='<div class="side-draw">'+esc(d.draws.length?d.draws.join(" / "):"ドローなし")+'</div>';
    }
    h+='</div>';
  });
  h+='</div>';

  if(S.phase==="ask"){
    h+='<div class="ask">';
    if(S.mode==="binary"){
      h+='<div class="ask-q">どっちが有利?</div><div class="picks">';
      h+='<button class="pick a" data-ans="A">A</button><button class="pick b" data-ans="B">B</button></div>';
    } else {
      h+='<div class="ask-q">Aの勝率は?</div><div class="slider-row">';
      h+='<div class="slider-val" id="gv">'+S.guess+'<span style="font-size:15px">%</span></div>';
      h+='<input type="range" min="0" max="100" value="'+S.guess+'" id="slider" aria-label="Aの勝率の見積もり"></div>';
      h+='<button class="pick" style="width:100%;margin-top:10px" data-ans="X">確定する</button>';
    }
    h+='</div>';
  } else {
    h+='<div class="cal"><div class="cal-track">';
    h+='<div class="fa" style="width:'+truePct+'%"></div>';
    h+='<div class="fb" style="width:'+(100-truePct)+'%"></div>';
    h+='<div class="gap" style="left:'+Math.min(guessPct,truePct)+'%;width:'+Math.abs(truePct-guessPct)+'%"></div>';
    h+='<div class="mid"></div>';
    h+='<div class="needle" style="left:calc('+guessPct+'% - 1.5px)"></div></div>';
    h+='<div class="cal-labels"><span style="color:var(--blue)">A '+truePct.toFixed(1)+'%</span>';
    h+='<span style="color:var(--red)">'+(100-truePct).toFixed(1)+'% B</span></div>';
    h+='<div class="cal-legend"><span>│ = '+(S.mode==="binary"?"あなたの選択":"あなたの見積もり")+'</span><span>▨ = ずれ '+err.toFixed(1)+'pt</span></div></div>';

    let vt,vok;
    if(S.mode==="binary"){ vok = S.choice===(truePct>=50?"A":"B"); vt = vok?"正解":"不正解"; }
    else if(err<=3){ vok=true; vt="ほぼ完璧"; }
    else if(err<=7){ vok=true; vt="実戦十分"; }
    else if(err<=12){ vok=false; vt="ずれ気味"; }
    else { vok=false; vt="要復習"; }
    h+='<div class="verdict"><span class="badge '+(vok?"ok":"ng")+'">'+vt+'</span>';
    h+='<span class="verdict-sub">'+S.elapsed.toFixed(1)+'秒 / 990通り全列挙</span></div>';

    const anc=nearestAnchor(truePct);
    if(anc){
      h+='<div class="sec"><div class="sec-h">近いアンカー値</div><div class="note"><b>'+esc(anc.disp)+' — '+esc(anc.label)+'</b>（'+anc.who+'側から見た値）。暗記済みの基準値でほぼ代用できる形です。</div></div>';
    }

    h+='<div class="sec"><div class="sec-h">ターンで形勢が動くカード</div>';
    if(!S.tmap){
      h+='<div class="note" style="color:var(--dim)">計算中…</div>';
    } else {
      const underA=sp.eq<0.5;
      const baseU=underA?sp.eq:1-sp.eq;
      const uHand=underA?sp.h1:sp.h2;
      const before=evalHand([...uHand,...sp.board])[0];
      const seen=[...sp.h1,...sp.h2,...sp.board];
      h+='<div class="ranks">';
      for(const t of S.tmap){
        const ua=underA?t.eq:1-t.eq;
        const delta=(ua-baseU)*100;
        const cards=FULL.filter(c=>rv(c)===t.rank&&!seen.includes(c));
        const after=Math.max(...cards.map(c=>evalHand([...uHand,...sp.board,c])[0]));
        // 毒アウト = 自分の手が伸びる（ペア成立 or ドロー完成）のに勝率が伸びないカード。
        // 単なるボードペアは全員に等しく効くので除外する。
        const pairsUp=uHand.map(rv).includes(t.rank);
        const completesDraw=cards.some(c=>{const a=evalHand([...uHand,...sp.board,c])[0]; return a>=4&&a>before;});
        const poison = (pairsUp||completesDraw) && after>before && delta<2;
        const cls = poison?"poison":delta>=8?"up":delta<=-8?"down":"flat";
        h+='<div class="rchip '+cls+'">'+t.label+'<span class="d">'+(delta>=0?"+":"")+delta.toFixed(0)+'</span></div>';
      }
      h+='</div>';
      h+='<div class="note" style="margin-top:9px;color:var(--dim);font-size:11.5px">不利な側（'+(underA?"A":"B")+'）から見たターン後の増減pt。<span style="color:var(--felt);font-weight:700">■緑=逆転筋</span> / <span style="color:var(--red);font-weight:700">■赤=致命傷</span> / <span style="color:var(--red);font-weight:700">破線=毒アウト</span>（役は上がるのに勝率が伸びない）</div>';
    }
    h+='</div>';
    h+='<button class="next" id="next">次の問題</button>';
  }

  $("panel").innerHTML=h;

  const sl=$("slider");
  if(sl){
    sl.addEventListener("input",e=>{ S.guess=Number(e.target.value); $("gv").innerHTML=S.guess+'<span style="font-size:15px">%</span>'; });
  }
  $("panel").querySelectorAll("[data-ans]").forEach(b=>{
    b.addEventListener("click",()=>answer(b.getAttribute("data-ans")==="X"?null:b.getAttribute("data-ans")));
  });
  const nx=$("next"); if(nx) nx.addEventListener("click",deal);

  renderStats();
}

function renderStats(){
  const acc = stats.n ? Math.round((stats.correct/stats.n)*100) : 0;
  const avg = stats.errN ? (stats.errSum/stats.errN).toFixed(1) : "—";
  $("stats").innerHTML =
    '<span>出題 <b>'+stats.n+'</b></span>'+
    (S.mode==="binary" ? '<span>正答率 <b>'+acc+'%</b></span>' : '<span>平均ずれ <b>'+avg+'</b>pt</span>')+
    '<span>連続 <b>'+stats.streak+'</b></span>'+
    '<span>最高 <b>'+stats.best+'</b></span>'+
    '<button class="reset" id="reset">記録を消す</button>';
  const r=$("reset");
  if(r) r.addEventListener("click",()=>{ stats={...DEFAULT_STATS}; saveStats(); renderStats(); });
}

/* モード切替 */
function setMode(m){
  S.mode=m;
  $("m-binary").setAttribute("aria-pressed",String(m==="binary"));
  $("m-estimate").setAttribute("aria-pressed",String(m==="estimate"));
  if(S.view==="anchors"){ renderStats(); return; }
  if(S.phase==="ask") render(); else renderStats();
}
$("m-anchors").addEventListener("click",()=>setView(S.view==="anchors"?"quiz":"anchors"));
$("m-binary").addEventListener("click",()=>setMode("binary"));
$("m-estimate").addEventListener("click",()=>setMode("estimate"));
$("m-close").addEventListener("click",()=>{
  S.closeOnly=!S.closeOnly;
  $("m-close").setAttribute("aria-pressed",String(S.closeOnly));
  deal();
});

/* Service Worker 登録（ホーム画面インストールとオフライン動作に必要） */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
  });
}

renderStats();
deal();
</script>
